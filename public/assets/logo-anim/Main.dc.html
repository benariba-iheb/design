<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo animé</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#666}a:hover{color:#333}
.logo-flow{
  position:absolute;inset:0;
  -webkit-mask-image:url(./assets/30fe596fccd6069b02efb16852300e89.png);
  mask-image:url(./assets/30fe596fccd6069b02efb16852300e89.png);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background-image:linear-gradient(90deg,#2DB34A 0%,#1E5BD8 25%,#2DB34A 50%,#1E5BD8 75%,#2DB34A 100%);
  background-size:200% 100%;
  mix-blend-mode:color;
  animation-name:logoFlow;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes logoFlow{
  from{background-position:0% 0}
  to{background-position:100% 0}
}
@media (prefers-reduced-motion: reduce){.logo-flow{animation:none}}
</style>
</helmet>
<div style="width: 880px; height: 600px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{bg}}">
<div style="position: relative; width: 617px; height: 413px; isolation: isolate">
<img src="./assets/30fe596fccd6069b02efb16852300e89.png" alt="Logo" style="display: block; width: 100%; height: 100%">
<div class="logo-flow" aria-hidden="true" style="animation-duration: {{dur}}s; animation-direction: {{dir}}"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dur":{"editor":"number","default":4,"min":1,"max":20,"label":"Durée d’un cycle (s)"},"reverse":{"editor":"boolean","default":false,"label":"Sens inverse"},"bg":{"editor":"color","default":"#FFFFFF","label":"Fond"},"$preview":{"width":880,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {
dur: this.props.dur ?? 4,
dir: this.props.reverse ? 'reverse' : 'normal',
bg: this.props.bg ?? '#FFFFFF'
};
}
}
</script>
</body>
</html>
