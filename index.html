<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <!-- Applique le thème avant le premier affichage (évite le flash clair → sombre) -->
    <script>
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("gasra.theme") || "dark"; } catch (e) {}
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        if (t === "dark") d.classList.add("dark");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gasra (قصرة) — De ton quartier, à ton pays</title>
    <meta name="description" content="Plateforme sociale algérienne : transforme le temps passé sur son téléphone en revenu local avec les Bons du quartier et la réputation par wilaya." />
    <meta name="theme-color" content="#0B1E26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gasra" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gasra (قصرة) — De ton quartier, à ton pays" />
    <meta property="og:description" content="Plateforme sociale algérienne : transforme le temps passé sur son téléphone en revenu local. من حومتك، لبلادك." />
    <meta property="og:image" content="/icon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gasra (قصرة) — De ton quartier, à ton pays" />
    <meta name="twitter:description" content="Plateforme sociale algérienne : transforme le temps passé sur son téléphone en revenu local. من حومتك، لبلادك." />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts: Readex Pro (Arabic + Latin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-gasra-bg text-gasra-text antialiased selection:bg-gasra-citron selection:text-gasra-petrole">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
